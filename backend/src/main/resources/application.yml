spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
      - optional:dotenv
  application:
    name: rentflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentflow}?sslmode=disable}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 92837498237498237498237489237489237498237498237498237498237489237489237489237489
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  mpesa:
    base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    short-code: ${MPESA_SHORTCODE}
    passkey: ${MPESA_PASSKEY}
    callback-url: ${MPESA_CALLBACK_URL:https://rentflow-backend-ssig.onrender.com/api/v1/mpesa/callback}
    environment: ${MPESA_ENVIRONMENT:sandbox}
    account-reference: RentFlow
    transaction-desc: Rent payment
  ai:
    base-url: https://api.openai.com/v1/completions
    api-key: ${OPENAI_API_KEY:}
    default-model: gpt-4o-mini
    max-tokens: 512
    temperature: 0.7
